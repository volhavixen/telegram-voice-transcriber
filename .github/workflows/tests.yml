name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

  deploy:
    name: Deploy to VPS
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.VPS_DEPLOY_ENABLED == 'true'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Configure SSH
        env:
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_SSH_HOST_KEY: ${{ vars.VPS_SSH_HOST_KEY }}
        run: |
          test -n "$VPS_DEPLOY_KEY"
          test -n "$VPS_HOST"
          test -n "$VPS_SSH_HOST_KEY"
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$VPS_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          printf '%s %s\n' "$VPS_HOST" "$VPS_SSH_HOST_KEY" > ~/.ssh/known_hosts

      - name: Update application and restart service
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
        run: |
          scp bot.py requirements.txt "telegramdeploy@${VPS_HOST}:/opt/telegram-voice-transcriber/"
          scp -r deploy "telegramdeploy@${VPS_HOST}:/opt/telegram-voice-transcriber/"
          ssh "telegramdeploy@${VPS_HOST}" 'cd /opt/telegram-voice-transcriber && .venv/bin/python -m pip install --no-cache-dir -r requirements.txt && sudo /usr/bin/systemctl restart telegram-voice-transcriber.service && sudo /usr/bin/systemctl is-active telegram-voice-transcriber.service'
